name: 📱 Build Signed Flutter APK (Enhanced)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "نوع البناء الذي تريد إنشاءه (debug / release / both)"
        required: true
        default: "both"
        type: choice
        options:
          - debug
          - release
          - both

env:
  FLUTTER_VERSION: '3.24.3'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'
  ANDROID_NDK_VERSION: '26.1.10909125'
  KEYSTORE_FILE: 'android/app/marina-hotel-key.jks'
  KEYSTORE_ALIAS: 'marina_key'
  KEYSTORE_PASSWORD: 'Marina@2025'
  KEY_PASSWORD: 'Marina@2025'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: ${{ github.event.inputs.build_type == 'both' && fromJSON('["debug","release"]') || fromJSON(format('["{0}"]', github.event.inputs.build_type)) }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk: ${{ env.ANDROID_NDK_VERSION }}

      - name: 🧹 Flutter Clean
        run: flutter clean

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🧠 Analyze Code
        run: flutter analyze || true

      - name: 🔐 Create Keystore (if not exists)
        run: |
          if [ ! -f "${{ env.KEYSTORE_FILE }}" ]; then
            keytool -genkey -v \
              -keystore ${{ env.KEYSTORE_FILE }} \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias ${{ env.KEYSTORE_ALIAS }} \
              -storepass ${{ env.KEYSTORE_PASSWORD }} \
              -keypass ${{ env.KEY_PASSWORD }} \
              -dname "CN=Marina Hotel, OU=DevOps, O=Marina Hotel, L=Aden, S=Aden, C=YE"
          fi

      - name: 🧾 Generate key.properties
        run: |
          echo "storePassword=${{ env.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ env.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ env.KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ env.KEYSTORE_FILE }}" >> android/key.properties

      - name: 🏗️ Build APK (${{ matrix.build_type }})
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: 📦 Rename APK
        run: |
          mkdir -p build/apk_output
          cp build/app/outputs/flutter-apk/app-${{ matrix.build_type }}.apk build/apk_output/marina-hotel-${{ matrix.build_type }}.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-${{ matrix.build_type }}-apk
          path: build/apk_output/marina-hotel-${{ matrix.build_type }}.apk

      - name: 🧾 Generate Build Report
        run: |
          echo "🔹 Build Type: ${{ matrix.build_type }}" > build_report.txt
          echo "🔹 Flutter Version: ${{ env.FLUTTER_VERSION }}" >> build_report.txt
          echo "🔹 Java Version: ${{ env.JAVA_VERSION }}" >> build_report.txt
          echo "🔹 Android SDK: ${{ env.ANDROID_API_LEVEL }}" >> build_report.txt
          echo "✅ Build completed successfully!" >> build_report.txt

      - name: 📤 Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.build_type }}
          path: build_report.txt
