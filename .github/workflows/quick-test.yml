name: ⚡ Quick Test & Debug

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
    paths:
      - 'mobile/**'
      - '.github/workflows/quick-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/quick-test.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - analyze
        - test
        - build
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
        - debug
        - release

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  # ====================================
  # Quick Analysis
  # ====================================
  quick-analyze:
    name: 🔍 Quick Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'analyze' || github.event.inputs.test_type == ''
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: 📦 Install Dependencies
      working-directory: mobile
      run: flutter pub get

    - name: 🔍 Flutter Doctor
      run: flutter doctor -v

    - name: 🔍 Flutter Analyze
      working-directory: mobile
      run: |
        echo "Running Flutter analyze..."
        flutter analyze --fatal-infos || echo "Analysis completed with warnings"

    - name: 📊 Dependencies Check
      working-directory: mobile
      run: |
        echo "Checking for outdated dependencies..."
        flutter pub outdated || echo "Dependencies check completed"

  # ====================================
  # Quick Tests
  # ====================================
  quick-test:
    name: 🧪 Quick Tests
    runs-on: ubuntu-latest
    needs: [quick-analyze]
    if: always() && (needs.quick-analyze.result == 'success' || needs.quick-analyze.result == 'skipped') && (github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'test' || github.event.inputs.test_type == '')
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: 📦 Install Dependencies
      working-directory: mobile
      run: flutter pub get

    - name: 🧪 Run Unit Tests
      working-directory: mobile
      run: |
        echo "Running unit tests..."
        flutter test --coverage || echo "Tests completed with some failures"

    - name: 📊 Test Coverage
      working-directory: mobile
      run: |
        if [ -f "coverage/lcov.info" ]; then
          echo "Test coverage report generated"
          echo "Coverage file size: $(stat -c%s coverage/lcov.info) bytes"
        else
          echo "No coverage report generated"
        fi

  # ====================================
  # Quick Build
  # ====================================
  quick-build:
    name: 🏗️ Quick Build
    runs-on: ubuntu-latest
    needs: [quick-analyze, quick-test]
    if: always() && (needs.quick-analyze.result == 'success' || needs.quick-analyze.result == 'skipped') && (needs.quick-test.result == 'success' || needs.quick-test.result == 'skipped') && (github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'build' || github.event.inputs.test_type == '')
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Install Dependencies
      working-directory: mobile
      run: flutter pub get

    - name: 📄 Accept Android Licenses
      run: yes | flutter doctor --android-licenses

    - name: 🏗️ Quick Debug Build
      working-directory: mobile
      if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
      run: |
        echo "Building debug APK..."
        flutter build apk --debug --verbose
        ls -la build/app/outputs/flutter-apk/

    - name: 🏗️ Quick Release Build
      working-directory: mobile
      if: github.event.inputs.build_type == 'release'
      run: |
        echo "Building release APK..."
        flutter build apk --release --verbose
        ls -la build/app/outputs/flutter-apk/

    - name: 📊 Build Analysis
      working-directory: mobile
      run: |
        echo "=== Build Analysis ==="
        find build/app/outputs/flutter-apk/ -name "*.apk" -exec ls -lh {} \; | while read line; do
          echo "📱 $line"
        done

    - name: 📤 Upload Quick Build
      uses: actions/upload-artifact@v4
      with:
        name: quick-build-${{ github.sha }}
        path: mobile/build/app/outputs/flutter-apk/*.apk
        retention-days: 7

  # ====================================
  # Quick Summary
  # ====================================
  quick-summary:
    name: 📊 Quick Summary
    runs-on: ubuntu-latest
    needs: [quick-analyze, quick-test, quick-build]
    if: always()
    
    steps:
    - name: 📊 Generate Summary
      run: |
        echo "## ⚡ Quick Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Analysis | ${{ needs.quick-analyze.result == 'success' && '✅ Success' || needs.quick-analyze.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Flutter analyze, doctor, dependencies |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.quick-test.result == 'success' && '✅ Success' || needs.quick-test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Unit tests, coverage |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.quick-build.result == 'success' && '✅ Success' || needs.quick-build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | APK build (${{ github.event.inputs.build_type || 'debug' }}) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.quick-build.result }}" = "success" ]; then
          echo "✅ **Build successful** - APK is ready for testing" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Download APK** - Check the Artifacts section below" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.quick-analyze.result }}" = "success" ]; then
          echo "✅ **Analysis passed** - Code quality is good" >> $GITHUB_STEP_SUMMARY
          echo "🏗️ **Ready for build** - Consider running full build workflow" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Issues found** - Check the logs above for details" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Fix issues** - Address any errors before proceeding" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔐 Login Credentials" >> $GITHUB_STEP_SUMMARY
        echo "- **Username**: \`admin\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Password**: \`1234\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🛠️ Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Java Version**: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY