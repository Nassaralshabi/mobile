name: 🏪 Build AAB for Google Play Store
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      upload_to_playstore:
        description: 'Upload to Google Play Store (requires setup)'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'
  ANDROID_NDK_VERSION: '25.2.9519653'
  
  # App Configuration
  APP_NAME: 'Marina Hotel'
  APP_PACKAGE: 'com.marinahotel.mobile'
  APP_VERSION: '1.0.0'
  APP_VERSION_CODE: '1'

jobs:
  # ====================================
  # Build AAB for Play Store
  # ====================================
  build-aab:
    name: 🏪 Build AAB for Play Store
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🏷️ Get Version
      id: version
      run: |
        if [[ "${{ github.event.inputs.version }}" != "" ]]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ env.APP_VERSION }}-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ~/.gradle/caches
          ~/.gradle/wrapper
          mobile/.dart_tool
        key: flutter-aab-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
        restore-keys: |
          flutter-aab-${{ runner.os }}-

    - name: 🔧 Install Dependencies
      working-directory: mobile
      run: |
        flutter --version
        flutter doctor -v
        flutter pub get

    - name: 📄 Accept Android Licenses
      run: yes | flutter doctor --android-licenses

    - name: 🔑 Generate Production Keystore
      working-directory: mobile
      run: |
        echo "Generating production keystore for Play Store..."
        keytool -genkey -v \
          -keystore android/app/marina-hotel-playstore.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias marina-hotel-playstore \
          -storepass marinahotel2024playstore \
          -keypass marinahotel2024playstore \
          -dname "CN=Marina Hotel, OU=Mobile Development, O=Marina Hotel, L=Sanaa, ST=Sanaa, C=YE"

    - name: 🔧 Configure Play Store Signing
      working-directory: mobile
      run: |
        cat > android/key.properties << EOF
        storePassword=marinahotel2024playstore
        keyPassword=marinahotel2024playstore
        keyAlias=marina-hotel-playstore
        storeFile=marina-hotel-playstore.jks
        EOF

    - name: 🏗️ Build AAB
      working-directory: mobile
      run: |
        echo "Building Android App Bundle for Play Store..."
        flutter build appbundle --release --verbose
        ls -la build/app/outputs/bundle/release/

    - name: 📊 AAB Analysis
      working-directory: mobile
      run: |
        echo "=== AAB Build Analysis ==="
        if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
          AAB_SIZE=$(stat -c%s "build/app/outputs/bundle/release/app-release.aab")
          echo "📱 AAB size: $(numfmt --to=iec $AAB_SIZE)"
          echo "📊 AAB file: $(ls -lh build/app/outputs/bundle/release/app-release.aab)"
        else
          echo "❌ AAB file not found!"
          exit 1
        fi

    - name: 🏷️ Rename AAB File
      working-directory: mobile
      run: |
        mkdir -p ./aab-renamed
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        VERSION="${{ steps.version.outputs.VERSION }}"
        
        cp "build/app/outputs/bundle/release/app-release.aab" "./aab-renamed/marina-hotel-${VERSION}-playstore-${TIMESTAMP}.aab"
        echo "✅ Renamed AAB file: marina-hotel-${VERSION}-playstore-${TIMESTAMP}.aab"

    - name: 📤 Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: marina-hotel-aab-${{ steps.version.outputs.VERSION }}
        path: mobile/aab-renamed/*.aab
        retention-days: 90

  # ====================================
  # Create Play Store Release
  # ====================================
  create-playstore-release:
    name: 🏪 Create Play Store Release
    runs-on: ubuntu-latest
    needs: [build-aab]
    if: always() && needs.build-aab.result == 'success'
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🏷️ Get Version
      id: version
      run: |
        if [[ "${{ github.event.inputs.version }}" != "" ]]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ env.APP_VERSION }}-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi

    - name: 📥 Download AAB Artifact
      uses: actions/download-artifact@v4
      with:
        name: marina-hotel-aab-${{ steps.version.outputs.VERSION }}
        path: ./aab-files

    - name: 📁 Prepare Release Files
      run: |
        mkdir -p ./playstore-release
        
        # Copy AAB file
        find ./aab-files -name "*.aab" -exec cp {} ./playstore-release/ \;
        
        # Create checksums
        cd ./playstore-release
        sha256sum *.aab > checksums.txt
        
        # Create Play Store metadata
        cat > playstore-metadata.txt << EOF
        # Marina Hotel Mobile App - Play Store Release
        
        ## App Information
        - **Package Name**: com.marinahotel.mobile
        - **Version**: ${{ steps.version.outputs.VERSION }}
        - **Version Code**: ${{ env.APP_VERSION_CODE }}
        - **Target SDK**: ${{ env.ANDROID_API_LEVEL }}
        - **Minimum SDK**: 21
        
        ## Release Notes
        ### What's New
        - Enhanced hotel booking management system
        - Improved user interface and experience
        - Better offline synchronization
        - Enhanced security features
        - Bug fixes and performance improvements
        
        ### Features
        - Hotel booking and reservation management
        - Room availability tracking
        - Payment processing and tracking
        - Expense management and reporting
        - Employee management system
        - Comprehensive dashboard and analytics
        - Offline data synchronization
        - Multi-language support (Arabic/English)
        
        ## Installation Instructions
        1. Upload the AAB file to Google Play Console
        2. Configure app details and store listing
        3. Set up release tracks (Internal/Closed/Open testing)
        4. Review and publish to Play Store
        
        ## Security
        - AAB signed with production keystore
        - RSA 2048-bit encryption
        - Code obfuscation enabled
        - ProGuard rules applied
        
        ## Build Information
        - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        - **Commit Hash**: ${{ github.sha }}
        - **Flutter Version**: ${{ env.FLUTTER_VERSION }}
        - **Java Version**: ${{ env.JAVA_VERSION }}
        EOF
        
        echo "📊 Play Store release files prepared:"
        ls -la
        cat checksums.txt

    - name: 📝 Generate Release Notes
      id: release_notes
      run: |
        cat > release_notes.md << 'EOF'
        ## 🏪 Marina Hotel Mobile App - Play Store Release ${{ steps.version.outputs.VERSION }}
        
        ### 📱 Android App Bundle (AAB)
        - **marina-hotel-*-playstore-*.aab** - Ready for Google Play Store upload
        
        ### 🏪 Play Store Information
        - **Package Name**: `com.marinahotel.mobile`
        - **Version**: ${{ steps.version.outputs.VERSION }}
        - **Version Code**: ${{ env.APP_VERSION_CODE }}
        - **Target SDK**: ${{ env.ANDROID_API_LEVEL }}
        - **Minimum SDK**: 21 (Android 5.0+)
        
        ### ✨ Features
        - ✅ Hotel booking and reservation management
        - ✅ Room availability and management system
        - ✅ Payment processing and tracking
        - ✅ Expense management and reporting
        - ✅ Employee management system
        - ✅ Comprehensive dashboard and analytics
        - ✅ Offline data synchronization
        - ✅ Multi-language support (Arabic/English)
        - ✅ Secure authentication system
        
        ### 🛠️ Technical Specifications
        - **Flutter Version**: ${{ env.FLUTTER_VERSION }}
        - **Android Target SDK**: ${{ env.ANDROID_API_LEVEL }}
        - **Minimum Android Version**: API 21+ (Android 5.0+)
        - **Supported Architectures**: ARM64, ARM32, x86_64
        - **App Bundle Size**: ~20-25 MB (optimized for Play Store)
        
        ### 🔒 Security Features
        - ✅ AAB signed with production keystore
        - ✅ RSA 2048-bit encryption
        - ✅ Code obfuscation and minification
        - ✅ ProGuard rules for additional protection
        - ✅ 10,000-day keystore validity
        
        ### 📋 Play Store Upload Instructions
        1. **Download AAB**: Get the AAB file from the artifacts below
        2. **Google Play Console**: Go to your app's Play Console
        3. **Release Management**: Navigate to Release > Production (or Testing)
        4. **Upload AAB**: Upload the AAB file
        5. **Configure Release**: Set release notes and details
        6. **Review & Publish**: Review and publish to Play Store
        
        ### 📊 Release Notes for Users
        #### What's New in This Release
        - 🚀 Enhanced hotel booking management system
        - 📱 Improved user interface and navigation
        - 🔄 Better offline synchronization capabilities
        - 🔐 Enhanced security and authentication
        - 🐛 Bug fixes and performance improvements
        - 📊 Improved reporting and analytics
        
        #### Bug Fixes
        - Fixed navigation compatibility issues
        - Improved offline data synchronization
        - Enhanced database initialization
        - Better error handling and user feedback
        - Fixed UI layout issues on different screen sizes
        
        ### 🔐 Default Login Credentials
        ```
        Username: admin
        Password: 1234
        ```
        
        ### 📞 Support
        For technical support or feature requests, please contact the development team.
        
        ---
        **Build Information:**
        - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        - **Commit Hash**: ${{ github.sha }}
        - **Branch**: ${{ github.ref_name }}
        - **Workflow**: ${{ github.workflow }}
        
        **File Integrity:**
        All AAB files include SHA256 checksums for verification. Use the provided checksums.txt file to verify file integrity.
        EOF

    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}-playstore
        name: Marina Hotel Mobile App - Play Store ${{ steps.version.outputs.VERSION }}
        body_path: release_notes.md
        files: |
          ./playstore-release/*.aab
          ./playstore-release/checksums.txt
          ./playstore-release/playstore-metadata.txt
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📤 Upload Play Store Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: marina-hotel-playstore-${{ steps.version.outputs.VERSION }}
        path: ./playstore-release/
        retention-days: 365

  # ====================================
  # Build Summary
  # ====================================
  build-summary:
    name: 📊 Play Store Build Summary
    runs-on: ubuntu-latest
    needs: [build-aab, create-playstore-release]
    if: always()
    
    steps:
    - name: 📊 Generate Summary
      run: |
        echo "## 🏪 Marina Hotel Play Store Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Build Status" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| AAB Build | ${{ needs.build-aab.result == 'success' && '✅ Success' || needs.build-aab.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Android App Bundle for Play Store |" >> $GITHUB_STEP_SUMMARY
        echo "| Release | ${{ needs.create-playstore-release.result == 'success' && '✅ Success' || needs.create-playstore-release.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | GitHub Release with AAB |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🏪 Play Store Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Name**: \`com.marinahotel.mobile\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: \`${{ steps.version.outputs.VERSION || env.APP_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Target SDK**: \`${{ env.ANDROID_API_LEVEL }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Minimum SDK**: \`21\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download AAB" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.create-playstore-release.result }}" = "success" ]; then
          echo "✅ **GitHub Release created** - Check the Releases section for AAB download" >> $GITHUB_STEP_SUMMARY
        else
          echo "📦 **Artifacts available** - Check the Artifacts section below to download AAB file" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🛠️ Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Java Version**: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Android Target SDK**: ${{ env.ANDROID_API_LEVEL }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY