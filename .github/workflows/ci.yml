name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'capy/**' ]
    paths:
      - 'mobile/**'
      - 'app-marina/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - 'app-marina/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - flutter
          - android
          - test-only

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  # ====================================
  # Code Quality & Tests
  # ====================================
  code-quality:
    name: 🔍 Code Quality & Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_type != 'android' }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          mobile/.dart_tool
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: deps-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'app-marina/**/*.gradle*') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: 📚 Install Flutter Dependencies
      working-directory: mobile
      run: |
        flutter pub get
        yes | flutter doctor --android-licenses

    - name: 🔍 Flutter Analysis
      working-directory: mobile
      run: |
        flutter analyze --no-fatal-infos

    - name: 🎨 Check Code Formatting
      working-directory: mobile
      run: |
        dart format --set-exit-if-changed .

    - name: 🧪 Run Flutter Tests
      working-directory: mobile
      run: |
        flutter test --coverage --reporter=json > test_results.json || true
        flutter test --coverage

    - name: 📊 Test Results Summary
      working-directory: mobile
      if: always()
      run: |
        echo "## 🎯 Flutter Test Results" >> $GITHUB_STEP_SUMMARY
        if [ -f "test_results.json" ]; then
          echo "Tests completed. Check logs for details." >> $GITHUB_STEP_SUMMARY
        else
          echo "No tests found or tests failed to run." >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Upload Test Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: flutter-coverage
        path: mobile/coverage/
        retention-days: 30

  # ====================================
  # Android Native App Tests
  # ====================================
  android-tests:
    name: 🤖 Android Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_type != 'flutter' }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          app-marina/.gradle
        key: gradle-test-${{ runner.os }}-${{ hashFiles('app-marina/**/*.gradle*') }}

    - name: 🔑 Make Gradlew Executable
      working-directory: app-marina
      run: chmod +x ./gradlew

    - name: 🧹 Clean Project
      working-directory: app-marina
      run: ./gradlew clean

    - name: 🔍 Android Lint Check
      working-directory: app-marina
      run: |
        ./gradlew lintDebug --continue || true

    - name: 🧪 Run Unit Tests
      working-directory: app-marina
      run: |
        ./gradlew testDebugUnitTest --continue || true

    - name: 🔧 Compile Check
      working-directory: app-marina
      run: |
        ./gradlew compileDebugSources

    - name: 📊 Generate Test Reports
      working-directory: app-marina
      if: always()
      run: |
        echo "## 🤖 Android Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Android build and tests completed." >> $GITHUB_STEP_SUMMARY

    - name: 📤 Upload Android Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-reports
        path: |
          app-marina/app/build/reports/
          app-marina/app/build/test-results/
        retention-days: 30

  # ====================================
  # Flutter App Build
  # ====================================
  build-flutter:
    name: 🎯 Build Flutter APK
    runs-on: ubuntu-latest
    needs: code-quality
    if: ${{ github.event.inputs.build_type != 'android' && github.event.inputs.build_type != 'test-only' && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped') }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          mobile/.dart_tool
        key: flutter-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}

    - name: 🔧 Install Dependencies
      working-directory: mobile
      run: |
        flutter pub get
        yes | flutter doctor --android-licenses

    - name: 🏗️ Build Debug APK
      working-directory: mobile
      run: |
        flutter build apk --debug --verbose

    - name: 🏗️ Build Release APK
      working-directory: mobile
      run: |
        flutter build apk --release --verbose

    - name: 📊 APK Info
      working-directory: mobile
      run: |
        echo "=== Flutter APK Build Results ==="
        if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
          echo "✅ Debug APK: $(ls -lh build/app/outputs/flutter-apk/app-debug.apk | awk '{print $5}')"
        fi
        if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
          echo "✅ Release APK: $(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}')"
        fi

    - name: 📤 Upload Flutter APKs
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apks-${{ github.sha }}
        path: |
          mobile/build/app/outputs/flutter-apk/*.apk
        retention-days: 30

  # ====================================
  # Android Native App Build
  # ====================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: android-tests
    if: ${{ github.event.inputs.build_type != 'flutter' && github.event.inputs.build_type != 'test-only' && (needs.android-tests.result == 'success' || needs.android-tests.result == 'skipped') }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          app-marina/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('app-marina/**/*.gradle*') }}

    - name: 🔑 Make Gradlew Executable
      working-directory: app-marina
      run: chmod +x ./gradlew

    - name: 🧹 Clean Project
      working-directory: app-marina
      run: ./gradlew clean

    - name: 🏗️ Build Debug APK
      working-directory: app-marina
      run: |
        ./gradlew assembleDebug --stacktrace --info

    - name: 🏗️ Build Release APK
      working-directory: app-marina
      run: |
        ./gradlew assembleRelease --stacktrace --info

    - name: 📊 APK Info
      working-directory: app-marina
      run: |
        echo "=== Android APK Build Results ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ Debug APK: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
        fi
        if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          echo "✅ Release APK: $(ls -lh app/build/outputs/apk/release/app-release-unsigned.apk | awk '{print $5}')"
        fi

    - name: 📤 Upload Android APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks-${{ github.sha }}
        path: |
          app-marina/app/build/outputs/apk/**/*.apk
        retention-days: 30

  # ====================================
  # Security & Credentials Check
  # ====================================
  security-check:
    name: 🛡️ Security Check
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔍 Check Login Configuration
      run: |
        echo "## 🔐 Login Configuration Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check Flutter login screen
        if grep -q "admin" mobile/lib/screens/login_screen.dart && grep -q "1234" mobile/lib/screens/login_screen.dart; then
          echo "- ✅ Flutter: Demo credentials configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Flutter: Demo credentials NOT configured" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check Flutter auth service
        if grep -q "admin.*1234\|username == 'admin' && password == '1234'" mobile/lib/services/auth_service.dart; then
          echo "- ✅ Flutter: Hardcoded admin/1234 authentication configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Flutter: Hardcoded admin/1234 authentication NOT configured" >> $GITHUB_STEP_SUMMARY
        fi

        # Check Android database prepopulation
        if grep -q "admin.*1234\|username.*admin.*password.*1234" app-marina/app/src/main/java/com/hotel/management/database/HotelDatabase.kt; then
          echo "- ✅ Android: Admin user prepopulation configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Android: Admin user prepopulation NOT configured" >> $GITHUB_STEP_SUMMARY
        fi

        # Check Navigation Safe Args fix
        if grep -q 'android:defaultValue="0L"' app-marina/app/src/main/res/navigation/nav_graph.xml; then
          echo "- ✅ Android: Navigation Safe Args fix applied" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Android: Navigation Safe Args fix NOT applied" >> $GITHUB_STEP_SUMMARY
        fi

  # ====================================
  # Build Summary
  # ====================================
  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [code-quality, android-tests, build-flutter, build-android, security-check]
    if: always()
    
    steps:
    - name: 📊 Generate Summary
      run: |
        echo "## 🏨 Marina Hotel CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Flutter Tests | ${{ needs.code-quality.result == 'success' && '✅ Success' || needs.code-quality.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Android Tests | ${{ needs.android-tests.result == 'success' && '✅ Success' || needs.android-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Flutter Build | ${{ needs.build-flutter.result == 'success' && '✅ Success' || needs.build-flutter.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Android Build | ${{ needs.build-android.result == 'success' && '✅ Success' || needs.build-android.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Check | ${{ needs.security-check.result == 'success' && '✅ Success' || needs.security-check.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔐 Login Credentials" >> $GITHUB_STEP_SUMMARY
        echo "- **Username**: \`admin\`" >> $GITHUB_STEP_SUMMARY  
        echo "- **Password**: \`1234\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download APKs" >> $GITHUB_STEP_SUMMARY
        echo "Check the **Artifacts** section below to download APK files." >> $GITHUB_STEP_SUMMARY